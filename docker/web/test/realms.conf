<VirtualHost *:48>
        ServerAdmin webmaster@rohonline.net
        DocumentRoot /home/realms/www/public/
        <Directory />
                Options FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>
        ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
        <Directory "/usr/lib/cgi-bin">
                AllowOverride None
                Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
                Require all granted
        </Directory>
        LogLevel warn
</VirtualHost>
